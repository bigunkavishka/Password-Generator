
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Password Generator</h1>

    <div class="output">
      <input id="password" type="text"
        placeholder="Your password" readonly>
      <button id="copyBtn">Copy</button>
    </div>

    <label for="length">
      Password Length: <span id="lengthValue">20</span>
    </label>
    <input type="range" id="length"
      min="8" max="64" value="20">

    <div class="options">
      <label><input type="checkbox" id="upper" checked>
        Uppercase (A-Z)</label>
      <label><input type="checkbox" id="lower" checked>
        Lowercase (a-z)</label>
      <label><input type="checkbox" id="numbers" checked>
        Numbers (0-9)</label>
      <label><input type="checkbox" id="symbols" checked>
        Symbols (!@#$)</label>
    </div>

    <button id="generate">Generate Password</button>
    <p id="message" aria-live="polite"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
